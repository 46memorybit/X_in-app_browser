<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>X 全面表示</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    #openButton {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 0;
      background: #000;
      color: #fff;

      font-size: clamp(36px, 10vw, 64px);
      font-weight: 900;

      cursor: pointer;
      touch-action: manipulation;
    }

    #openButton:active {
      background: #181818;
    }

    #openButton:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(24px, env(safe-area-inset-bottom));
      padding: 12px;
      color: #888;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <button id="openButton" type="button">
    𝕏
  </button>

  <div id="status"></div>

  <script>
    // ========================================
    // 設定
    // ========================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyitYM42zrd_bzzVLyqTFJlgpjQE-bLUcjUmxCOiJhhyX9Q2kJulWYv9GTeJHLAQbILzQ/exec";

    // ========================================
    // URL取得・遷移
    // ========================================

    const openButton = document.getElementById("openButton");
    const status = document.getElementById("status");

    openButton.addEventListener("click", async () => {

      if (openButton.disabled) return;

      openButton.disabled = true;
      status.textContent = "URLを取得しています...";

      try {

        // GASにGETリクエスト
        const response = await fetch(API_URL, {
          method: "GET",
          cache: "no-store",
          redirect: "follow"
        });

        if (!response.ok) {
          throw new Error(`HTTPエラー: ${response.status}`);
        }

        // GASから返されたURLを取得
        const result = await response.text();

        const targetURL = result.trim();

        // URLの検証
        const url = new URL(targetURL);

        if (
          url.protocol !== "https:" ||
          url.hostname !== "x.com"
        ) {
          throw new Error("GASから正しいXのURLが返されませんでした。");
        }

        // 取得したURLへ遷移
        window.location.href = url.href;

      } catch (error) {

        console.error(error);

        status.textContent = "URLの取得に失敗しました。";

        openButton.disabled = false;

      }

    });

    // ========================================
    // Service Worker
    // ========================================

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(console.error);
      });
    }
  </script>

</body>
</html>
